[project]
name = "agentic-autorag"
version = "0.1.0"
description = "Reasoning-driven optimizer for RAG pipelines"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Lasse Bærland Strand" },
]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "optimization",
    "llm",
    "automl",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pymupdf>=1.24.0",
    "docling>=2.0",
    "lancedb",
    "litellm",
    "numpy",
    "scipy",
    "scikit-learn",
    "sentence-transformers",
    "transformers",
    "torch",
    "tqdm",
    "typer>=0.9",
    "google-cloud-aiplatform>=1.40",
    "google-auth>=2.0",
    "boto3>=1.28",
    "azure-identity>=1.15",
    "lightrag-hku>=1.4.10",
    "mteb>=2.10.9",
    "python-dotenv>=1.2.1",
    "datasets",
    "opencv-python-headless>=4.13.0.92",
]

[project.scripts]
agentic-autorag = "agentic_autorag.cli:app"

[project.urls]
Homepage = "https://github.com/lassebaerlandstrand/Agentic-AutoRAG"
Repository = "https://github.com/lassebaerlandstrand/Agentic-AutoRAG"
Issues = "https://github.com/lassebaerlandstrand/Agentic-AutoRAG/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "arxiv>=2.0",
    "matplotlib>=3.10.8",
    "jupyterlab>=4.5.4",
    "vllm>=0.19",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Only collect the unit suite. ``scripts/`` holds manual helper scripts (e.g.
# test_models.py, test_llm.py) that are run by hand to probe live endpoints —
# their ``test_``-prefixed names must not be auto-collected as unit tests.
testpaths = ["tests"]
markers = [
    "slow: marks tests that are slow (e.g. PDF parsing with model downloads). Skipped by default, run with --run-slow.",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
extend-ignore = ["D102", "D103"]

[tool.ruff.lint.flake8-bugbear]
# typer declares CLI params via Option/Argument calls in argument defaults —
# the idiomatic pattern, not a B008 mutable-default-argument bug.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["assets"]

[tool.hatch.build.targets.wheel]
packages = ["agentic_autorag"]

[tool.ruff.lint.isort]
known-first-party = ["agentic_autorag"]
