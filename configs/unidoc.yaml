# Agentic AutoRAG — UniDoc (real healthcare PDFs) exam-generation probe.
#
# Purpose of this config: run the examiner against a real-PDF corpus so we
# can inspect what the composer does on documents that contain references,
# acknowledgments, author info, tables, and figures — content absent from
# the HotpotQA Wikipedia-paragraph corpus. The single trial is incidental;
# we want exam.json to read.
#
# Prereq: ``data/corpus/unidoc/`` populated by
#   uv run python scripts/download_unidoc_corpus.py
#
# Expected runtime: ~5-15 min (exam gen) + ~5-15 min (one trial).

model_aliases:
  azure/gpt-5-nano: azure/gpt-5-nano-1
  azure/gpt-5-mini: azure/gpt-5-mini-1

meta:
  project_name: "unidoc-exam-probe"
  corpus_path: "./data/corpus/unidoc/"
  corpus_description: |
    Enterprise healthcare PDFs from UniDoc-Bench: insurance forms, clinical
    notes, EOB statements, and similar real-world documents. Multi-page
    layouts with tables and figures; some files include reference lists,
    acknowledgments, and author/affiliation blocks.
  output_dir: "./experiments-unidoc-probe/"
  max_trials: 1
  cache_max_gb: 5.0
  # Keep parsed corpus bounded so embedding/indexing stays cheap for the
  # one trial. ~500k words across the selected PDFs is enough to surface
  # cross-doc pairing + section-classified exclusions.
  corpus_word_budget: 2_000_000
  corpus_sample_seed: 42
  allow_early_exit: false

parsing:
  parser: "docling"
  ocr: true
  table_structure: true
  near_duplicate_detection_enabled: true
  near_duplicate_threshold: 0.85

agent:
  examiner_model: "azure/DeepSeek-V3.2"
  optimizer_model: "azure/DeepSeek-V3.2"
  judge_model: "azure/DeepSeek-V3.2"
  optimizer_reasoning_effort: medium
  examiner_reasoning_effort: medium
  concurrency: 10

examiner:
  # Match HotpotQA's exam_size so question quality is directly comparable
  # across corpora.
  exam_size: 50
  pair_overgeneration_factor: 1.0
  probe_selection: true

  composition_temperature: 1.0

  # --- Neighborhood builder ---
  # UniDoc chunks are dense (~1000 words/chunk) so the word floor binds
  # first — ~5 chunks ≈ 5000 words. Cross-doc overlap is sparse on
  # UniDoc (independent papers with little shared terminology), so the
  # neighborhood is dominated by same-document siblings (methods +
  # results + discussion within one paper).
  neighborhood_min_chunks: 12
  neighborhood_min_words: 5000
  neighborhood_same_doc_fraction: 0.8

  max_chunk_words: 1000
  min_doc_words: 200

  # On real PDFs these section labels actually fire. References &
  # acknowledgments are R6-relevant: dropping them at the chunking
  # boundary means the LLM never even sees biblio content as candidate
  # bridges — which is what we want to compare against HotpotQA, where
  # this filter is silent because Wikipedia paragraphs lack headers.
  excluded_section_types:
    - references
    - acknowledgments
    - author_info

  source_fact_verify_fuzzy_threshold: 0.9
  chunk_relevance_min_overlap_chars: 50
  chunk_relevance_ngram_size: 5
  chunk_relevance_overlap_threshold: 0.5
  chunk_relevance_min_run: 5

# Minimum viable search space — the trial exists to complete the pipeline,
# not to explore configs. One chunking strategy, one embedding, one index
# type, no reranker, no query expansion, one generator.
search_space:
  chunking:
    strategies: ["recursive"]
    chunk_token_size: { values: [256] }
    chunk_token_overlap: { values: [32] }

  embedding:
    models:
      - "sentence-transformers/all-MiniLM-L6-v2"
      - "BAAI/bge-m3"
      - "BAAI/bge-large-en-v1.5"
      - "ibm-granite/granite-embedding-english-r2"
      - "ibm-granite/granite-embedding-small-english-r2"
      - "Qwen/Qwen3-Embedding-0.6B"
      - "IEITYuan/Yuan-embedding-2.0-en"
      - "Snowflake/snowflake-arctic-embed-l-v2.0"
      - "mixedbread-ai/mxbai-embed-large-v1"
      - "intfloat/multilingual-e5-large-instruct"
      - "intfloat/e5-large-v2"
      - "google/embeddinggemma-300m"
      - "Alibaba-NLP/gte-multilingual-base"
      - "Alibaba-NLP/gte-large-en-v1.5"

  retrieval:
    index_types:
      - "vector_only"
      - "hybrid_bm25_vector"
    top_k: { min: 3, max: 20 }
    hybrid_alpha: { min: 0.0, max: 1.0 }

  query_expansion:
    strategies: ["none"]
    models: []

  reranker:
    models:
      - "none"
      - "BAAI/bge-reranker-v2-m3"
      - "cross-encoder/ms-marco-MiniLM-L-6-v2"
      - "Alibaba-NLP/gte-reranker-modernbert-base"
      - "mixedbread-ai/mxbai-rerank-xsmall-v1"
    top_n: { min: 3, max: 10 }

  passage_compressor:
    strategies: ["none"]
    models: []

  generator:
    models:
      - "bedrock/global.amazon.nova-2-lite-v1:0"
      - "bedrock/openai.gpt-oss-20b-1:0"
      - "bedrock/openai.gpt-oss-120b-1:0"
      - "bedrock/qwen.qwen3-32b-v1:0"
      - "bedrock/minimax.minimax-m2.1"
      - "bedrock/minimax.minimax-m2.5"
      - "bedrock/nvidia.nemotron-nano-3-30b"
      - "bedrock/nvidia.nemotron-nano-12b-v2"
      - "bedrock/nvidia.nemotron-super-3-120b"
      - "bedrock/us.meta.llama3-3-70b-instruct-v1:0"
      - "bedrock/us.meta.llama4-maverick-17b-instruct-v1:0"
      - "bedrock/us.meta.llama3-1-8b-instruct-v1:0"
      - "bedrock/us.amazon.nova-micro-v1:0"
      - "bedrock/mistral.magistral-small-2509"
      - "bedrock/mistral.ministral-3-14b-instruct"
      - "bedrock/mistral.ministral-3-8b-instruct"
      - "bedrock/mistral.ministral-3-3b-instruct"
      - "bedrock/mistral.mistral-large-3-675b-instruct"
      - "bedrock/mistral.mistral-7b-instruct-v0:2"
      - "bedrock/mistral.mixtral-8x7b-instruct-v0:1"
      - "bedrock/qwen.qwen3-next-80b-a3b"
      - "bedrock/google.gemma-3-4b-it"
      - "bedrock/google.gemma-3-12b-it"
      - "bedrock/google.gemma-3-27b-it"
      - "bedrock/moonshotai.kimi-k2.5"
      - "bedrock/zai.glm-4.7-flash"
      - "bedrock/zai.glm-4.7"
      - "bedrock/us.deepseek.r1-v1:0"
      - "azure/gpt-4o"
      - "azure/gpt-4o-mini"
      - "azure/o4-mini"
      - "azure/gpt-5-mini"
      - "azure/gpt-5-nano"
      - "azure/gpt-5.4-mini"
      - "azure/gpt-5.4-nano"
    reasoning: true
    reasoning_effort: medium

  temperature: { min: 1.0, max: 1.0 }
