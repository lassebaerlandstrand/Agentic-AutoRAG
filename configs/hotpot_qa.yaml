# Agentic AutoRAG — HotpotQA (distractor) benchmark config (v4 schema).
#
# Prereqs:
#   uv run agentic-autorag benchmark-prepare hotpot_qa \
#       --split validation --sample-size 1000 --seed 42 \
#       --output benchmark_data/hotpot_val_1000
#
# Sample-size notes:
#   - 500  → ~5k corpus docs, parse <1s, retrieval trivial.
#   - 1000 → ~10k corpus docs. Good optimization/eval tradeoff. DEFAULT.
#   - 2000 → ~19k corpus docs, ~30-60min eval per trial, tightest CIs.
#
# Validation rationale: HotpotQA explicitly constructs cross-paragraph 2-hop
# bridges (2 supporting paragraphs + 8 distractors per question). Embedding
# pairing should produce high-yield seeds and exercise the question-generator
# framing under conditions where a real bridge actually exists. If exam
# generation fails here, the pipeline is broken; if it succeeds here but
# fails on UniDoc-Bench, the corpus is the problem (which our last UniDoc
# run confirmed: cosines collapsed in [0.4, 0.6] across 2M cross-doc pairs).

meta:
  project_name: "hotpot-qa-distractor-1000"
  corpus_path: "./benchmark_data/hotpot_val_1000/corpus"
  corpus_description: |
    HotpotQA distractor validation split, pooled 1000-question corpus:
    ~10k Wikipedia paragraph-level documents (2 gold + 8 distractors per
    question, deduplicated by title). Multi-hop reasoning, mostly 2 hops,
    bridge and comparison question types.
  output_dir: "./experiments-hotspot/"
  max_trials: 5
  cache_max_gb: 5.0

agent:
  examiner_model: "gemini/gemini-3.1-flash-lite-preview"
  optimizer_model: "gemini/gemini-3-flash-preview"
  optimizer_reasoning_effort: medium
  max_history_trials: 10
  concurrency: 10

examiner:
  # --- Exam scale ---
  # HotpotQA has dense bridges by construction; over-generate less heavily
  # than UniDoc-Bench (which needs 6× to absorb topic-disjoint refusals).
  exam_size: 50
  pair_overgeneration_factor: 3.0
  probe_selection: true

  # --- Composition LLM ---
  composition_batch_size: 4
  composition_temperature: 1.0
  # Per-seed PREFERRED question-type sampling weights. HotpotQA has dense
  # bridge structure; bridge_chain wins by construction, but the typed mix
  # forces synthesis-style answers (counts, comparisons, exclusions) that
  # break saturation when retrieval is strong.
  question_type_weights:
    comparison: 0.25
    multi_constraint: 0.25
    exclusion: 0.20
    arithmetic: 0.15
    bridge_chain: 0.15

  # --- Pair-embedding index ---
  # Wikipedia paragraphs are short (~100-300 words), well within bge-m3's
  # 8192-token capacity. Same model as full.yaml for consistency. K=5 over
  # ~10k chunks gives plenty of seeds.
  pair_embedding_model: "BAAI/bge-m3"
  pair_top_k_per_chunk: 5

  # --- Document chunking ---
  # HotpotQA paragraphs are short (one paragraph per doc). doc_section_word_size
  # is irrelevant in practice — splitting almost never triggers because each
  # doc is well below the threshold. Set tight so an unusually long doc still
  # fits in one chunk.
  doc_split_word_threshold: 120000
  doc_section_word_size: 500
  # Wikipedia paragraphs can be 30-50 words; lower the floor so we don't
  # silently drop valid HotpotQA distractors.
  min_doc_words: 20

  # --- Section classifier ---
  # Wikipedia paragraphs have no header structure; the classifier defaults to
  # "body" for unlabelled chunks. Keep the default allowlist; biblio
  # exclusions don't bind on this corpus.
  eligible_section_types:
    - body
    - abstract
    - methods
    - results
    - discussion
    - other

  # --- Source span / chunk-relevance verification ---
  source_fact_verify_fuzzy_threshold: 0.9
  chunk_relevance_min_overlap_chars: 50
  chunk_relevance_ngram_size: 5
  chunk_relevance_overlap_threshold: 0.5
  chunk_relevance_min_run: 5

  # --- Scoring ---
  retrieval_quality_alpha: 0.7

  # --- Fallback embedding model ---
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"

parsing:
  # HotpotQA corpus is pre-extracted markdown — parser/ocr/table_structure
  # are unused but required by the schema validator.
  parser: "docling"
  ocr: false
  table_structure: false
  # Near-duplicate detection still runs; HotpotQA's distractor pool may
  # contain near-identical paragraphs (same Wikipedia article, different
  # extracts), so leave detection on.
  near_duplicate_detection_enabled: true
  near_duplicate_threshold: 0.85

search_space:
  # --- Index-building ---
  # HotpotQA paragraphs are short (often <500 tokens each), so cap chunk
  # size at 512 — larger chunks often span a whole article. Overlap up to 64
  # gives the reranker room to breathe without doubling the token budget.
  chunking:
    strategies: ["recursive", "fixed"]
    chunk_token_size: { min: 128, max: 512 }
    chunk_token_overlap: { min: 0, max: 64 }
  embedding_models:
    - "sentence-transformers/all-MiniLM-L6-v2"
    - "BAAI/bge-m3"
    - "BAAI/bge-large-en-v1.5"
    - "ibm-granite/granite-embedding-english-r2"
    - "Qwen/Qwen3-Embedding-0.6B"
    - "IEITYuan/Yuan-embedding-2.0-en"
    - "Snowflake/snowflake-arctic-embed-l-v2.0"
    - "mixedbread-ai/mxbai-embed-large-v1"
    - "intfloat/multilingual-e5-large-instruct"
    - "intfloat/e5-large-v2"
  index_types:
    - "vector_only"
    - "hybrid_bm25_vector"

  # --- Retrieval ---
  # Multi-hop needs at least 2 supporting passages. Wider top_k tends to help
  # here; 3-20 matches what recent HotpotQA-distractor RAG papers sweep.
  top_k: { min: 3, max: 20 }
  hybrid_alpha: { min: 0.0, max: 1.0 }
  reranker:
    models:
      - "none"
      - "BAAI/bge-reranker-v2-m3"
      - "cross-encoder/ms-marco-MiniLM-L-6-v2"
      - "Alibaba-NLP/gte-reranker-modernbert-base"
    top_n: { min: 3, max: 10 }
  query_expansion: ["none"]

  # --- Generation ---
  llm_models:
    - "bedrock/global.anthropic.claude-haiku-4-5-20251001-v1:0"
    - "bedrock/global.anthropic.claude-sonnet-4-5-20250929-v1:0"
    - "bedrock/global.amazon.nova-2-lite-v1:0"
    - "bedrock/zai.glm-4.7-flash"
    - "bedrock/openai.gpt-oss-20b-1:0"
    - "bedrock/openai.gpt-oss-120b-1:0"
    - "bedrock/qwen.qwen3-32b-v1:0"
    - "bedrock/minimax.minimax-m2.1"
    - "bedrock/minimax.minimax-m2.5"
    - "bedrock/nvidia.nemotron-nano-3-30b"
    - "bedrock/nvidia.nemotron-nano-12b-v2"
    - "azure/gpt-4o"
    - "azure/gpt-4o-mini"
    - "azure/o4-mini"

  temperature: { min: 1.0, max: 1.0 }
  reasoning: false
  reasoning_effort: medium
