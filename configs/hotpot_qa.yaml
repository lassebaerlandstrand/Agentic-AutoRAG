# Agentic AutoRAG — HotpotQA (distractor) benchmark config.
#
# Prereqs:
#   uv run agentic-autorag benchmark-prepare hotpot_qa \
#       --split validation --sample-size 1000 --seed 42 \
#       --output benchmark_data/hotpot_val_1000
#
# Sample-size notes:
#   - 500  → ~5k corpus docs, parse <1s, retrieval trivial.
#   - 1000 → ~10k corpus docs. Good optimization/eval tradeoff. DEFAULT.
#   - 2000 → ~19k corpus docs, ~30-60min eval per trial, tightest CIs.
#
# HotpotQA MCQ-generation note: single-paragraph Wikipedia docs are highly
# distinctive, so ~85% of MCQ candidates are filtered out by the retrieval-
# difficulty pipeline (weak embedder finds them at top_k=1). The effective
# MCQ yield is ~10-15% of the candidate pool — that's why exam_size and
# initial_candidate_multiplier below are both generous.

meta:
  project_name: "hotpot-qa-distractor-1000"
  corpus_path: "./benchmark_data/hotpot_val_1000/corpus"
  corpus_description: |
    HotpotQA distractor validation split, pooled 1000-question corpus:
    ~10k Wikipedia paragraph-level documents (2 gold + 8 distractors per
    question, deduplicated by title). Multi-hop reasoning, mostly 2 hops,
    bridge and comparison question types.
  output_dir: "./experiments/hotpot"
  max_trials: 5
  cache_max_gb: 5.0

agent:
  examiner_model: "gemini/gemini-2.5-flash-lite"
  optimizer_model: "gemini/gemini-3-flash-preview"
  optimizer_reasoning_effort: medium
  max_history_trials: 10
  concurrency: 10

examiner:
  # Target exam_size drives per-trial cost. HotpotQA's retrieval-difficulty
  # filter is aggressive (~85% of candidates removed as "trivially retrievable"),
  # so we over-generate heavily: candidate pool = exam_size × multiplier = 800.
  # Expected final exam ≈ 80-100 questions — slightly above target 80 is fine.
  exam_size: 50
  initial_candidate_multiplier: 10
  max_backfill_rounds: 3
  probe_selection: true
  detect_parametric_leaks: false
  parametric_leak_trials: 3

  source_fact_min_length: 120  # HotpotQA paragraphs are short; lower than default
  source_fact_verify_fuzzy_threshold: 0.9

  chunk_relevance_min_overlap_chars: 50
  chunk_relevance_ngram_size: 5
  chunk_relevance_overlap_threshold: 0.5
  chunk_relevance_min_run: 5

  # HotpotQA docs are short (a handful of sentences each) so splitting is effectively never triggered.
  doc_split_word_threshold: 120000
  doc_section_word_size: 6000
  min_doc_words: 20

  oracle_context_window_words: 300
  oracle_retry_with_full_doc: true

  max_questions_per_doc: 2

  max_generation_retries: 5
  dedup_similarity_threshold: 0.90
  discriminator_removal_pct: 0.05

  difficulty_weighted_allocation: true
  min_questions_per_cluster: 1

  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"

parsing:
  parser: "docling"  # unused for markdown-only corpora but required by schema
  ocr: false
  table_structure: false

search_space:
  # --- Index-building ---
  # HotpotQA paragraphs are short (often <500 tokens each), so we cap chunk
  # size at 512 — larger chunks often span a whole article. Overlap up to 64
  # gives the reranker room to breathe without doubling the token budget.
  chunking:
    strategies: ["recursive", "fixed"]
    chunk_token_size: { min: 128, max: 512 }
    chunk_token_overlap: { min: 0, max: 64 }
  embedding_models:
    - "sentence-transformers/all-MiniLM-L6-v2"
    - "BAAI/bge-m3"
    - "BAAI/bge-large-en-v1.5"
    - "ibm-granite/granite-embedding-english-r2"
    - "Qwen/Qwen3-Embedding-0.6B"
    - "IEITYuan/Yuan-embedding-2.0-en"
    - "Snowflake/snowflake-arctic-embed-l-v2.0"
    - "mixedbread-ai/mxbai-embed-large-v1"
    - "intfloat/multilingual-e5-large-instruct"
    - "intfloat/e5-large-v2"
  index_types:
    - "vector_only"
    - "hybrid_bm25_vector"
    # - "graph_only"              # requires graph: section + LightRAG build
    # - "hybrid_graph_vector"     # idem

  # --- Retrieval ---
  # Multi-hop needs at least 2 supporting passages. Wider top_k tends to help
  # here; 3-20 matches what recent HotpotQA-distractor RAG papers sweep.
  top_k: { min: 3, max: 20 }
  hybrid_alpha: { min: 0.0, max: 1.0 }
  reranker:
    models:
      - "none"
      - "BAAI/bge-reranker-v2-m3"
      - "cross-encoder/ms-marco-MiniLM-L-6-v2"
      - "Alibaba-NLP/gte-reranker-modernbert-base"
    top_n: { min: 3, max: 10 }
  query_expansion: ["none"]
  # query_expansion: ["none", "hyde", "multi_query"]   # enable to let the agent trial expansion

  # --- Generation ---
  llm_models:
    # Cloud — uncomment the provider rows whose API credentials you have.
    # Bedrock (AWS_REGION_NAME + AWS credentials)
    - "bedrock/global.anthropic.claude-haiku-4-5-20251001-v1:0"
    - "bedrock/global.anthropic.claude-sonnet-4-5-20250929-v1:0"
    - "bedrock/global.amazon.nova-2-lite-v1:0"
    - "bedrock/zai.glm-4.7-flash"
    - "bedrock/openai.gpt-oss-20b-1:0"
    - "bedrock/openai.gpt-oss-120b-1:0"
    - "bedrock/qwen.qwen3-32b-v1:0"
    - "bedrock/minimax.minimax-m2.1"
    - "bedrock/minimax.minimax-m2.5"
    - "bedrock/nvidia.nemotron-nano-3-30b"
    - "bedrock/nvidia.nemotron-nano-12b-v2"

    # Vertex AI (VERTEXAI_PROJECT + VERTEXAI_LOCATION)
    - model: "vertex_ai/gemini-2.5-flash"
      reasoning: true
    - "vertex_ai/gemini-2.5-flash-lite"

    # Azure (AZURE_API_KEY + AZURE_API_BASE)
    - "azure/gpt-4o"
    - "azure/gpt-4o-mini"
    - "azure/o4-mini"

    # Google AI Studio (GEMINI_API_KEY) — the examiner/optimizer already use these.
    # - "gemini/gemini-2.5-flash"
    # - "gemini/gemini-2.5-flash-lite"

    # Local — Ollama (requires `ollama serve` + `ollama pull <model>`)
    # - "ollama/llama3.1:8b"
    # - "ollama/qwen2.5:14b"

    # Local — vLLM (uv sync --extra vllm). Uncomment the vllm: section below too.
    # - "hosted_vllm/Qwen/Qwen3-0.6B"
    # - "hosted_vllm/Qwen/Qwen3-8B"

  # Many reasoning-capable models reject temperature=0, so we fix it at 1.0 —
  # same choice as full.yaml. This keeps the broadest model coverage. The
  # per-model variability this introduces is averaged over the QA sample.
  temperature: { min: 1.0, max: 1.0 }
  reasoning: false                # global default; per-model override above for gemini-2.5-flash
  reasoning_effort: medium

# vllm:                                    # uncomment if you add hosted_vllm/ models
#   max_model_len: 8192
#   gpu_memory_utilization: 0.90
#   enforce_eager: true
