# Agentic AutoRAG — HotpotQA (distractor) benchmark config (v4 schema).
#
# Prereqs:
#   uv run agentic-autorag benchmark-prepare hotpot_qa \
#       --split validation --sample-size 1000 --seed 42 \
#       --output benchmark_data/hotpot_val_1000
#
# Sample-size notes:
#   - 500  → ~5k corpus docs, parse <1s, retrieval trivial.
#   - 1000 → ~10k corpus docs. Good optimization/eval tradeoff. DEFAULT.
#   - 2000 → ~19k corpus docs, ~30-60min eval per trial, tightest CIs.
#
# Validation rationale: HotpotQA explicitly constructs cross-paragraph 2-hop
# bridges (2 supporting paragraphs + 8 distractors per question). Embedding
# pairing should produce high-yield seeds and exercise the question-generator
# framing under conditions where a real bridge actually exists. If exam
# generation fails here, the pipeline is broken; if it succeeds here but
# fails on UniDoc-Bench, the corpus is the problem (which our last UniDoc
# run confirmed: cosines collapsed in [0.4, 0.6] across 2M cross-doc pairs).

# Map short names used below (in the search-space stage pools and the agent:
# block) to the real LiteLLM model identifier the framework should call. Two
# value shapes are supported:
#
#   azure/gpt-5-nano: azure/gpt-5-nano-1          # simple: alias → deployment
#   local-llama:                                  # extended: custom endpoint
#     model: openai/meta-llama-3.1-70b
#     api_base: http://localhost:8000/v1
#     api_key: dummy
#
# Omit this section entirely when every model is reachable by its canonical
# LiteLLM name (the common case for OpenAI/Anthropic/Bedrock direct usage).
# Edit only the deployment names on the right to match your Azure tenant.
model_aliases:
  azure/gpt-5-nano: azure/gpt-5-nano-1
  azure/gpt-5-mini: azure/gpt-5-mini-1

meta:
  project_name: "hotpot-qa-distractor-2000"
  corpus_path: "./benchmark_data/hotpot_val_2000/corpus"
  corpus_description: |
    HotpotQA distractor validation split, pooled 2000-question corpus:
    ~19k Wikipedia paragraph-level documents (2 gold + 8 distractors per
    question, deduplicated by title). Multi-hop reasoning, mostly 2 hops,
    bridge and comparison question types.
  output_dir: "./experiments-hotpot/"
  max_trials: 15
  cache_max_gb: 5.0
  cost_aware: false

agent:
  examiner_model: "azure_ai/DeepSeek-V3.2"
  optimizer_model: "azure_ai/DeepSeek-V3.2"
  # Pin the judge to a reliable endpoint instead of letting the auto-pick
  # land on a search-space LLM that throws frequent provider 5xx errors.
  judge_model: "azure_ai/DeepSeek-V3.2"
  examiner_reasoning_effort: medium
  optimizer_reasoning_effort: medium
  concurrency: 10

examiner:
  # --- Exam scale ---
  # Each neighborhood produces multiple questions, so pair_overgeneration_factor
  # is divided by an expected ~2-3 questions per call when sizing the anchor pool.
  exam_size: 50
  pair_overgeneration_factor: 1.0
  probe_selection: true

  # --- Neighborhood builder ---
  # The composer sees a NEIGHBORHOOD per call: anchor + same-document
  # siblings + cosine-similar cross-document chunks. The neighborhood grows
  # until it has at least neighborhood_min_chunks chunks OR
  # neighborhood_min_words words, whichever first.
  # HotpotQA chunks are ~100 words → 18-chunk floor binds first (~1.8k words).
  # Bumped 12 → 18 to give the composer more raw material for 3+ hop chains
  # (the previous 12-chunk neighborhood produced only 1.5% 3-hop questions).
  # HotpotQA is cross-doc-rich; bias the neighborhood toward cosine-similar
  # cross-doc chunks (zero same-doc weight — paragraphs typically have no
  # siblings within the same Wikipedia article anyway).
  neighborhood_min_chunks: 18
  neighborhood_min_words: 5000
  neighborhood_same_doc_weight: 0.0 # HotpotQA paragraph are too short to have any
  neighborhood_cross_doc_weight: 1.0

  # --- Document chunking ---
  # HotpotQA paragraphs are short (~50-100 words each), so HybridChunker
  # almost never splits at the default 1200-word budget — every doc fits in
  # one chunk. ``max_chunk_words`` left at default; min_doc_words lowered so
  # we don't silently drop valid HotpotQA distractors.
  min_doc_words: 20

  # --- Section classifier ---
  # Wikipedia paragraphs have no header structure; the classifier defaults
  # to "body" for unlabelled chunks. The default deny-list still applies
  # but doesn't bind on this corpus.
  excluded_section_types:
    - references
    - acknowledgments
    - author_info

  # --- Source span / chunk-relevance verification ---
  source_fact_verify_fuzzy_threshold: 0.9
  chunk_relevance_min_overlap_chars: 50
  chunk_relevance_ngram_size: 5
  chunk_relevance_overlap_threshold: 0.5
  chunk_relevance_min_run: 5

parsing:
  # HotpotQA corpus is pre-extracted markdown — ocr/table_structure are
  # unused but required by the schema validator.
  ocr: false
  table_structure: false
  # Near-duplicate detection still runs; HotpotQA's distractor pool may
  # contain near-identical paragraphs (same Wikipedia article, different
  # extracts), so leave detection on.
  near_duplicate_detection_enabled: true
  near_duplicate_threshold: 0.85

search_space:
  # --- Index-building ---
  # HotpotQA paragraphs are short (often <500 tokens each), so cap chunk
  # size at 512 — larger chunks often span a whole article. Overlap up to 64
  # gives the reranker room to breathe without doubling the token budget.
  chunking:
    strategies: ["recursive", "fixed"]
    chunk_token_size: { values: [128, 256, 384, 512] }
    chunk_token_overlap: { values: [0, 32, 48, 64] }

  embedding:
    models:
      - "sentence-transformers/all-MiniLM-L6-v2"
      - "BAAI/bge-m3"
      - "BAAI/bge-large-en-v1.5"
      - "BAAI/bge-small-en-v1.5"
      - "ibm-granite/granite-embedding-english-r2"
      - "ibm-granite/granite-embedding-small-english-r2"
      - "Qwen/Qwen3-Embedding-0.6B"
      - "IEITYuan/Yuan-embedding-2.0-en"
      - "Snowflake/snowflake-arctic-embed-l-v2.0"
      - "mixedbread-ai/mxbai-embed-large-v1"
      - "intfloat/multilingual-e5-large-instruct"
      - "intfloat/e5-large-v2"
      - "google/embeddinggemma-300m"
      - "Alibaba-NLP/gte-multilingual-base"

  # --- Retrieval ---
  # Multi-hop needs at least 2 supporting passages. Wider top_k tends to help
  # here; 3-20 matches what recent HotpotQA-distractor RAG papers sweep.
  retrieval:
    index_types:
      - "vector_only"
      - "hybrid_bm25_vector"
    top_k: { min: 3, max: 20 }
    hybrid_alpha: { min: 0.0, max: 1.0 }
    bm25_vector_fusion: ["alpha", "rrf"]
    long_context_reorder: [false, true]

  # --- Query expansion ---
  # ``strategies`` gates the stage; ``models`` is the cheap utility pool drawn
  # from when a non-"none" strategy is chosen.
  query_expansion:
    strategies: ["none", "hyde", "multi_query", "query_decompose"]
    models:
      - "azure/gpt-4o-mini"

  reranker:
    models:
      - "none"
      - "BAAI/bge-reranker-v2-m3"
      - "cross-encoder/ms-marco-MiniLM-L-6-v2"
      - "Alibaba-NLP/gte-reranker-modernbert-base"
      - "mixedbread-ai/mxbai-rerank-xsmall-v1"
    top_n: { min: 3, max: 10 }

  # --- Generation ---
  # The generator pool is the paper-claim set. Expander/compressor pools are
  # intentionally small (cheap utility LLMs) — those stages reward fluency
  # more than capability.
  generator:
    models:
      - "bedrock/global.amazon.nova-2-lite-v1:0"
      - "bedrock/openai.gpt-oss-20b-1:0"
      - "bedrock/openai.gpt-oss-120b-1:0"
      - "bedrock/qwen.qwen3-32b-v1:0"
      - "bedrock/minimax.minimax-m2.1"
      - "bedrock/minimax.minimax-m2.5"
      - "bedrock/nvidia.nemotron-nano-3-30b"
      - "bedrock/nvidia.nemotron-nano-12b-v2"
      - "bedrock/nvidia.nemotron-super-3-120b"
      - "bedrock/us.meta.llama3-3-70b-instruct-v1:0"
      - "bedrock/us.meta.llama4-maverick-17b-instruct-v1:0"
      - "bedrock/us.meta.llama3-1-8b-instruct-v1:0"
      - "bedrock/us.amazon.nova-micro-v1:0"
      - "bedrock/mistral.magistral-small-2509"
      - "bedrock/mistral.ministral-3-14b-instruct"
      - "bedrock/mistral.ministral-3-8b-instruct"
      - "bedrock/mistral.ministral-3-3b-instruct"
      - "bedrock/mistral.mistral-large-3-675b-instruct"
      - "bedrock/mistral.mistral-7b-instruct-v0:2"
      - "bedrock/mistral.mixtral-8x7b-instruct-v0:1"
      - "bedrock/qwen.qwen3-next-80b-a3b"
      - "bedrock/google.gemma-3-4b-it"
      - "bedrock/google.gemma-3-12b-it"
      - "bedrock/google.gemma-3-27b-it"
      - "bedrock/moonshotai.kimi-k2.5"
      - "bedrock/zai.glm-4.7-flash"
      - "bedrock/zai.glm-4.7"
      - "bedrock/us.meta.llama4-scout-17b-instruct-v1:0"
      - "bedrock/us.amazon.nova-lite-v1:0"
      - "bedrock/minimax.minimax-m2"
      - "azure/gpt-4o"
      - "azure/gpt-4o-mini"
      - "azure/gpt-5-mini"
      - "azure/gpt-5-nano"
      - "azure/gpt-5.4-mini"
      - "azure/gpt-5.4-nano"
      - "azure/o4-mini"
      - "vertex_ai/gemini-3-flash-preview"
      - "vertex_ai/gemini-3.1-flash-lite-preview"
      - "vertex_ai/gemini-2.5-flash-lite"
      - "vertex_ai/gemini-2.5-flash"
    reasoning: true
    reasoning_effort: medium

  temperature: { min: 1.0, max: 1.0 }
