# Agentic AutoRAG — Full Configuration
# Complete search space with all supported options.

meta:
  project_name: "my-rag-project"
  corpus_path: "./data/corpus/"
  corpus_description: |
    A collection of ~50 ArXiv papers across 5 CS and physics categories.
    The corpus covers NLP, computer vision, machine learning, 
    statistics, and optics. Documents are academic papers
    with mathematical notation, tables, figures, and references.
  output_dir: "./experiments/"
  max_trials: 30
  index_registry: true

structural:
  parsers:
    - "docling"
    - "pymupdf4llm"
  chunking:
    strategies: ["recursive", "fixed"]
    chunk_size: { min: 256, max: 2048 }
    chunk_overlap: { min: 0, max: 256 }
  embedding_models:
    - "sentence-transformers/all-MiniLM-L6-v2"
    - "BAAI/bge-m3"
    - "BAAI/bge-large-en-v1.5"
  index_types:
    - "vector_only"
    - "hybrid_bm25_vector"

runtime:
  retrieval:
    top_k: { min: 3, max: 20 }
    hybrid_alpha: { min: 0.0, max: 1.0 }
    reranker:
      models:
        - "none"
        - "BAAI/bge-reranker-v2-m3"
        - "cross-encoder/ms-marco-MiniLM-L-6-v2"
      top_n: { min: 3, max: 10 }
    query_expansion: ["none", "hyde"]
  generation:
    llm_models:
      # Local — requires Ollama running (ollama serve) with models pulled
      # - "ollama/llama3.2"
      # - "ollama/llama3.1:8b"
      # - "ollama/mistral"
      # - "ollama/gemma2:9b"
      # - "ollama/qwen2.5:7b"
      # - "ollama/qwen2.5:14b"
      # - "ollama/phi4"
      # Cloud: Google Gemini — requires GEMINI_API_KEY (see README)
      - "gemini/gemini-2.0-flash"
      - "gemini/gemini-2.0-flash-lite"
      - "gemini/gemini-2.5-flash"
      - "gemini/gemini-2.5-flash-lite"
    temperature: { min: 0.0, max: 1.0 }

examiner:
  exam_size: 50
  irt_discrimination_threshold: 0.3
  refresh_interval_trials: 5

# Agent models (optimizer and examiner) — see README for provider API key requirements
agent:
  optimizer_model: "gemini/gemini-3-flash-preview"
  examiner_model: "gemini/gemini-3-flash-preview"
  max_history_trials: 10
