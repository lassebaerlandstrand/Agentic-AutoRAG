# Agentic AutoRAG — Full Configuration
# Complete search space with all supported options, including LightRAG graph retrieval.

meta:
  project_name: "my-rag-project"
  # corpus_path: "./data/corpus/arxiv/"
  # corpus_description: |
  #   A collection of ~50 ArXiv papers across 5 CS and physics categories.
  #   The corpus covers NLP, computer vision, machine learning,
  #   statistics, and optics. Documents are academic papers
  #   with mathematical notation, tables, figures, and references.

  # --- Alternative: BEIR / Natural Questions corpus ---
  # corpus_path: "./data/corpus/nq/"
  # corpus_description: |
  #   BEIR / Natural Questions corpus: Wikipedia passages (~100-300 words each).
  #   Standard retrieval benchmark; pre-extracted text, no PDF parsing involved.

  # --- Alternative: UniDoc-Bench corpus (real enterprise PDFs + images) ---
  corpus_path: "./data/corpus/unidoc/"
  corpus_description: |
    UniDoc-Bench corpus: real-world enterprise documents from the Healthcare
    domain. Includes multi-page PDFs with complex layouts (tables, figures, mixed
    text) alongside individual page images. Single-domain for maximum topical
    overlap and retrieval difficulty.

  output_dir: "./experiments/"
  max_trials: 10
  # Upper bound for the ingredient cache at experiments/.cache/ingredients/.
  # Each entry (chunks + embeddings for one chunker × embedder × corpus tuple)
  # is ~20 MB for a 10 k-chunk corpus and scales linearly with corpus size.
  # Raise this for larger corpora or wider search spaces; lower to trade cache
  # hit rate for disk. LRU evicts oldest entries when the budget is exceeded.
  cache_max_gb: 5.0
  # Early-exit gate. The agent owns when to terminate via
  # ``strategy.stance="done"`` — this requires ``allow_early_exit: true``
  # AND a minimum trial floor (max of ``min_trials_before_done`` and 40%
  # of max_trials) AND a frontier of at least ``min_frontier_size_for_done``
  # members AND HV growth ≤ ``early_exit_hv_epsilon`` over the last 3 trials.
  # allow_early_exit: true
  # min_trials_before_done: 4
  # min_frontier_size_for_done: 2
  # early_exit_hv_epsilon: 0.001
  # Anti-flapping lock: a stance committed at trial K must hold for
  # ``min_stance_lock_trials`` further trials before transitions resume.
  # min_stance_lock_trials: 1
  # polish_score_tolerance: 0.05  # band used for cheapest-in-band signal

# Agent models (optimizer and examiner) — see README for provider API key requirements
agent:
  # examiner_model: "gemini/gemini-2.5-flash-lite"
  examiner_model: "azure/o4-mini"
  # examiner_model: "azure/gpt-5.4-nano"
  optimizer_model: "azure/o4-mini"
  # Strong reference model for the oracle answerability gate (during exam
  # generation) and the trial-time judge (grades free-form predictions when
  # EM=0). When null, the framework auto-picks the strongest LLM in the
  # search space. Override here when the auto-pick is unreliable (frequent
  # provider 5xx, rate limits, deprecated endpoints).
  # judge_model: "gemini/gemini-3-flash-preview"
  # Reasoning effort for the Diagnoser + Proposer LLM calls. "low" | "medium" |
  # "high" | null. Passed through to litellm.acompletion when the model
  # supports reasoning; silently skipped for models that don't.
  optimizer_reasoning_effort: medium
  # Same shape, applied to examiner LLM calls (composition + single-hop probe)
  # routed to ``examiner_model``. Defaults to null (off).
  examiner_reasoning_effort: medium
  max_history_trials: 10
  concurrency: 5 # Reduce if you hit LLM provider rate limits (e.g. 429 errors).

examiner:
  # --- Exam scale ---
  exam_size: 20
  # Over-generate seeds 6× to absorb composition / probe / oracle rejections.
  pair_overgeneration_factor: 6.0
  # Always-on 4-probe discrimination filter. Disable only for tests / quick
  # debug runs — the ordinary pipeline relies on this to score every
  # candidate against 2-4 search-space extremes and pick the most
  # discriminating subset.
  probe_selection: true

  # --- Composition LLM ---
  # K seeds per composition LLM call. K=4 balances cost vs. attention.
  composition_batch_size: 4
  # Sampling temperature for the composition LLM. Default 1.0 because
  # several frontier reasoning models REQUIRE this exact value; lower it on
  # models that allow flexibility for stricter rule-following.
  composition_temperature: 1.0
  # Cooler temperature for batches whose preferred type is `numeric`. Math
  # reliability matters more than diversity — the harness evaluates the
  # emitted formula and rejects questions whose math disagrees with the
  # canonical answer, so a cooler sampler raises yield. Set to null to fall
  # back to composition_temperature.
  composition_temperature_numeric: 0.2
  # Per-seed PREFERRED reasoning-type sampling weights. The composition LLM
  # gets a hint per seed and is allowed to fall back to any other type or
  # refuse — types are not forced. Five-type taxonomy:
  #   extraction  — single-hop factoid lookup answerable from one verbatim
  #                 span (CRAG "Simple", QASPER extractive)
  #   definitional — single-hop "what is X" answered from one chunk's
  #                  descriptive content (RAGAS abstract / QASPER abstractive)
  #   bridge       — indirect reference in chunk_A + look up attribute in
  #                  chunk_B (HotpotQA, MuSiQue 2-hop chain)
  #   comparison   — read comparable values from both chunks and compare
  #                  (HotpotQA, 2WikiMultiHopQA, CRAG, MultiHop-RAG)
  #   numeric      — compute across the chunks (subsumes arithmetic AND
  #                  temporal: dates are encoded as days('YYYY-MM-DD',
  #                  'YYYY-MM-DD'); the harness verifies the formula
  #                  externally before the question is accepted)
  # Weights need not sum to 1.0 (normalised before sampling). Unused types
  # may be omitted.
  question_type_weights:
    extraction: 0.25
    definitional: 0.10
    bridge: 0.25
    comparison: 0.20
    numeric: 0.20

  # --- Seed-origin mix ---
  # Proportions of seed origins in the over-generated pool. Tune per corpus:
  #   single_chunk    — one chunk → single-hop questions. Robust on real
  #                     PDFs (medical / legal / enterprise) where most facts
  #                     live in one section.
  #   same_doc_pair   — two chunks WITHIN one document, mid-band cosine and
  #                     section-disjoint. Captures section-pair multi-hop
  #                     (e.g. methods + results, definition + use).
  #   cross_doc_pair  — two chunks from DIFFERENT documents (Wikipedia-style
  #                     2-hop). Requires real cross-doc entity overlap.
  # Defaults below favour single-doc structure; for HotpotQA-like corpora
  # shift toward cross_doc_pair (see configs/hotpot_qa.yaml).
  seed_mix:
    single_chunk: 0.5
    same_doc_pair: 0.3
    cross_doc_pair: 0.2

  # --- Pair-embedding index for chunk-similarity seed discovery ---
  # Used by the same-doc and cross-doc pair generators. Embeds every
  # eligible chunk once. Cross-doc selects per-chunk top-K cross-doc
  # neighbours via round-robin over rank; same-doc selects within-doc pairs
  # whose cosine lies in the configured mid-band.
  #
  # bge-m3 accepts up to 8192 tokens per chunk; smaller models with
  # max_seq_length=256/512 (e.g. all-MiniLM, BGE-large) silently truncate
  # 1500-word chunks and embed only the intro paragraph. Cost: ~568M-param
  # model, ~2GB first download.
  pair_embedding_model: "BAAI/bge-m3"
  pair_top_k_per_chunk: 5

  # --- Same-doc pair generator ---
  # Cosine band [min, max] for chunk pairs WITHIN one document. Mid-band
  # picks chunks that share a topic without being paraphrases; combined
  # with a section-disjoint filter this produces clean two-hop seeds inside
  # one paper / report.
  same_doc_pair_cosine_min: 0.4
  same_doc_pair_cosine_max: 0.85

  # --- Document chunking for the exam pipeline ---
  # The exam pipeline uses its own chunker (separate from per-trial retrieval
  # chunks). Smaller chunks → more chunks per doc → cleaner per-chunk
  # embedding signal; very large chunks collapse each paper into one
  # embedding and starve the cross-doc pair pool.
  doc_split_word_threshold: 120000
  doc_section_word_size: 1500
  min_doc_words: 50

  # --- Section classifier ---
  # Pairing skips chunks whose heuristic section label is outside this list.
  # Default excludes references, acknowledgments, and author_info to
  # structurally suppress citation-mining questions. Allowed values: body,
  # abstract, methods, results, discussion, references, acknowledgments,
  # author_info, other.
  eligible_section_types:
    - body
    - abstract
    - methods
    - results
    - discussion
    - other

  # --- Source span / chunk-relevance verification ---
  source_fact_verify_fuzzy_threshold: 0.9
  chunk_relevance_min_overlap_chars: 50
  chunk_relevance_ngram_size: 5
  chunk_relevance_overlap_threshold: 0.5
  chunk_relevance_min_run: 5

  # --- Scoring ---
  # composite = alpha * answer_accuracy + (1 - alpha) * mean_retrieval_quality
  retrieval_quality_alpha: 0.7

  # --- Fallback embedding model ---
  # Small/fast embedder used by lightweight utility paths. Pairing uses the
  # separate pair_embedding_model above (long-context); this one need not
  # match the search-space embedding models.
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"

parsing:
  parser: "docling"
  ocr: true
  table_structure: true
  # Near-duplicate detection runs once at setup and emits metadata only —
  # the optimization loop continues to see the full corpus (duplicates and
  # all) so the recommended configuration wins on the user's deployed data.
  # Only exam-generation and the gate-2 BM25 baseline read the dedup map.
  near_duplicate_detection_enabled: true
  # Containment cutoff: |A∩B| / min(|A|,|B|) over normalised token shingles
  # (lowercased, word-only). 0.85 catches OCR-of-PDF page images even when
  # ~12-15% of shingles diverge due to OCR character substitutions on
  # daggers / footnote marks. Containment subsumes Jaccard at the same
  # threshold and additionally catches asymmetric subset relationships
  # (small page-image inside multi-page PDF). Raise toward 1.0 for stricter
  # clustering.
  near_duplicate_threshold: 0.85

# # Fixed graph build configuration — outside the search space.
# # Only needed if search_space.index_types includes "graph_only" or "hybrid_graph_vector".
# # The graph is built once, in batches of build_batch_size; progress is persisted to
# # build_manifest.json so a crashed build resumes where it left off. The manifest also
# # records the corpus + config hash — a mismatch causes a loud error rather than a
# # silent reuse. Delete ./experiments/lightrag/ to force a full rebuild.
# graph:
#   # Cheap extraction model called hundreds of times during build. All three below
#   # sit in the ~$0.10–0.24/1M-output-token range; pick the one matching whichever
#   # provider credentials you already have.
#   extraction_model: "gemini/gemini-2.5-flash-lite"                              # $0.10/$0.40 per 1M tokens
#   # extraction_model: "bedrock/global.amazon.nova-2-lite-v1:0"        # $0.06/$0.24 per 1M tokens
#   # extraction_model: "gemini/gemini-2.5-flash-lite"                  # $0.10/$0.40; may log malformed-record warnings
#   # Local via vLLM — auto-managed; server is started before the build and
#   # swapped out when trials need a different hosted_vllm/ model.
#   # extraction_model: "hosted_vllm/Qwen/Qwen3-30B-A3B-Instruct-AWQ"
#   embedding_model: "IEITYuan/Yuan-embedding-2.0-en"                   # local model, no API key needed
#   # Concurrency — peak LLM calls ≈ max_parallel_insert × llm_model_max_async.
#   # 4 × 4 = 16 is safe on free/low-tier cloud quotas; raise if you have headroom.
#   max_parallel_insert: 4       # documents processed concurrently
#   llm_model_max_async: 4       # concurrent LLM workers inside LightRAG
#   llm_model_max_retries: 3     # capped + jittered exponential back-off on 429/503
#   # Timeouts. LightRAG kills workers at 2× these internally; the config validator
#   # asserts our retry budget (extraction_call_timeout_s × attempts + sleeps) fits
#   # inside that kill window.
#   # default_llm_timeout: 180           # LightRAG default; worker cap = 360s
#   # default_embedding_timeout: 30      # LightRAG default; worker cap = 60s
#   # embedding_func_max_async: 8        # LightRAG default
#   extraction_call_timeout_s: 55      # per-call timeout passed to litellm.acompletion
#   # extraction_retry_backoff_base_s: 5 # first sleep ≈ base * 2^0 (with 0.5–1.5× jitter)
#   # extraction_retry_backoff_max_s: 30 # caps sleep so budget stays under worker cap
#   # Checkpointing & throughput — do not affect graph content, only how it's built.
#   build_batch_size: 16         # docs per ainsert call; smaller = more frequent checkpoints
#   embedding_batch_size: 64     # SentenceTransformer batch size; raise on GPU for speed
#   # chunk_token_size: 1200        # LightRAG internal chunking; omit to use LightRAG default
#   # chunk_overlap_token_size: 100  # omit to use LightRAG default
#   # entity_types: null            # omit = LightRAG defaults

# # Optional vLLM server settings — defaults are used when omitted.
# # Only relevant if search_space.llm_models includes hosted_vllm/ models.
# # The framework auto-manages the vLLM server: starting, stopping, and
# # swapping models between trials.
# vllm:
#   max_model_len: 8192            # auto-detected from model; set to reduce VRAM usage
#   gpu_memory_utilization: 0.50   # embedding and reranker models also use VRAM
#   enforce_eager: true            # faster model swap (~30s vs ~80s)
#   port: 8000
#   startup_timeout: 180
#   extra_args: []                 # e.g. ["--reasoning-parser", "qwen3"]

search_space:
  # --- Index-building ---
  chunking:
    strategies: ["recursive", "fixed"]
    chunk_token_size: { min: 64, max: 1024 }
    chunk_token_overlap: { min: 0, max: 128 }
  embedding_models:
    - "sentence-transformers/all-MiniLM-L6-v2"
    - "BAAI/bge-m3"
    - "BAAI/bge-large-en-v1.5"
    - "ibm-granite/granite-embedding-english-r2"
    - "Qwen/Qwen3-Embedding-0.6B"
    - "IEITYuan/Yuan-embedding-2.0-en"
    - "Snowflake/snowflake-arctic-embed-l-v2.0"
    - "mixedbread-ai/mxbai-embed-large-v1"
    - "intfloat/multilingual-e5-large-instruct"
    - "intfloat/e5-large-v2"
  index_types:
    - "vector_only"
    - "hybrid_bm25_vector"
    # - "graph_only"
    # - "hybrid_graph_vector"

  # --- Retrieval ---
  top_k: { min: 3, max: 20 }
  hybrid_alpha: { min: 0.0, max: 1.0 }
  reranker:
    models:
      - "none"
      - "BAAI/bge-reranker-v2-m3"
      - "cross-encoder/ms-marco-MiniLM-L-6-v2"
      - "Alibaba-NLP/gte-reranker-modernbert-base"
    top_n: { min: 3, max: 10 }
  query_expansion: ["none"]
  # query_expansion: ["none", "hyde", "multi_query"]

  # --- Generation ---
  # Find model ids with this: https://models.litellm.ai/
  llm_models:
    # Local — requires Ollama running (ollama serve) with models pulled
    # Note: Ollama models do not support reasoning via LiteLLM's reasoning_effort.
    # Reasoning is auto-disabled for ollama/ models unless explicitly overridden.
    # - "ollama/llama3.2"
    # - "ollama/llama3.1:8b"
    # - "ollama/mistral"
    # - "ollama/gemma2:9b"
    # - "ollama/qwen2.5:7b"
    # - "ollama/qwen2.5:14b"
    # - "ollama/phi4"

    # Local — requires vLLM (uv sync --extra dev) and a GPU.
    # The framework manages the vLLM server automatically.
    # Pre-download models: uv run hf download <model-name>
    # - "hosted_vllm/Qwen/Qwen3-0.6B"
    # - "hosted_vllm/google/gemma-3-1b-it"
    # - "hosted_vllm/ibm-granite/granite-3.3-2b-instruct"

    # Cloud
    - "bedrock/global.anthropic.claude-haiku-4-5-20251001-v1:0"
    - "bedrock/global.anthropic.claude-sonnet-4-5-20250929-v1:0"
    - "bedrock/global.amazon.nova-2-lite-v1:0"
    - "bedrock/zai.glm-4.7-flash"
    - "bedrock/openai.gpt-oss-20b-1:0"
    - "bedrock/openai.gpt-oss-120b-1:0"
    - "bedrock/qwen.qwen3-32b-v1:0"
    - "bedrock/minimax.minimax-m2.1"
    - "bedrock/minimax.minimax-m2.5"
    # - "bedrock/moonshotai.kimi-k2.5"
    - "bedrock/nvidia.nemotron-nano-3-30b"
    - "bedrock/nvidia.nemotron-nano-12b-v2"

    # - model: "vertex_ai/gemini-2.5-flash"
    #   reasoning: true
    # - "vertex_ai/gemini-2.5-flash-lite"

    # - "azure/DeepSeek-V3.2"
    - "azure/gpt-4o"
    - "azure/gpt-4o-mini"
    - "azure/o4-mini"
  temperature: { min: 1.0, max: 1.0 }
  reasoning: false # Global default: allow optimizer to enable reasoning for LLMs
  reasoning_effort: medium # Effort level when reasoning is enabled (low/medium/high)


  # # --- Graph retrieval (only active when index_type is graph_only or hybrid_graph_vector) ---
  # graph_retrieval:
  #   graph_query_modes:
  #     - "local"    # entity-focused: good for specific factual questions
  #     - "global"   # relationship-focused: good for broad thematic questions
  #     - "hybrid"   # combines local + global (usually best default)
  #   graph_top_k: { min: 20, max: 100 }
