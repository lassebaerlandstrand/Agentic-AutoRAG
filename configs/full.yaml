# Agentic AutoRAG — Full Configuration
# Complete search space with all supported options, including LightRAG graph retrieval.

meta:
  project_name: "my-rag-project"
  corpus_path: "./data/corpus/"
  corpus_description: |
    A collection of ~50 ArXiv papers across 5 CS and physics categories.
    The corpus covers NLP, computer vision, machine learning, 
    statistics, and optics. Documents are academic papers
    with mathematical notation, tables, figures, and references.
  output_dir: "./experiments/"
  max_trials: 10
  index_registry: true

# Agent models (optimizer and examiner) — see README for provider API key requirements
agent:
  optimizer_model: "gemini/gemini-3-flash-preview"
  examiner_model: "gemini/gemini-3-flash-preview"
  max_history_trials: 10
  concurrency: 15 # Reduce if you hit LLM provider rate limits (e.g. 429 errors).

examiner:
  exam_size: 50
  irt_discrimination_threshold: 0.3
  refresh_interval_trials: 5
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"

parsing:
  parser: "docling"
  ocr: true
  table_structure: true

# Fixed graph build configuration — outside the search space.
# Only needed if search_space.index_types includes "graph_only" or "hybrid_graph_vector".
# The graph is built once and cached; delete ./experiments/lightrag/ to force a rebuild.
graph:
  extraction_model: "gemini/gemini-2.5-flash-lite"  # cheap model, called hundreds of times
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"  # local model, no API key needed
  # Concurrency controls — peak LLM calls ≈ max_parallel_insert × llm_model_max_async.
  # Lower these if you hit 429 / RESOURCE_EXHAUSTED errors.
  max_parallel_insert: 8       # documents processed concurrently
  llm_model_max_async: 8       # concurrent LLM workers inside LightRAG
  llm_model_max_retries: 6     # exponential back-off retries on 429/503
  # chunk_token_size: 1200        # LightRAG internal chunking; omit to use LightRAG default
  # chunk_overlap_token_size: 100  # omit to use LightRAG default
  # entity_types: null            # omit = LightRAG defaults

search_space:
  # --- Index-building ---
  chunking:
    strategies: ["recursive", "fixed"]
    chunk_size: { min: 256, max: 512 }
    chunk_overlap: { min: 0, max: 128 }
  embedding_models:
    - "sentence-transformers/all-MiniLM-L6-v2"
    - "BAAI/bge-m3"
    - "BAAI/bge-large-en-v1.5"
  index_types:
    - "vector_only"
    - "hybrid_bm25_vector"
    - "graph_only"
    - "hybrid_graph_vector"

  # --- Retrieval ---
  top_k: { min: 3, max: 20 }
  hybrid_alpha: { min: 0.0, max: 1.0 }
  reranker:
    models:
      - "none"
      - "BAAI/bge-reranker-v2-m3"
      - "cross-encoder/ms-marco-MiniLM-L-6-v2"
    top_n: { min: 3, max: 10 }
  query_expansion: ["none"]

  # --- Generation ---
  llm_models:
    # Local — requires Ollama running (ollama serve) with models pulled
    # - "ollama/llama3.2"
    # - "ollama/llama3.1:8b"
    # - "ollama/mistral"
    # - "ollama/gemma2:9b"
    # - "ollama/qwen2.5:7b"
    # - "ollama/qwen2.5:14b"
    # - "ollama/phi4"
    # Cloud
    # - "gemini/gemini-2.5-flash-lite"
    - "bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0"
    - "bedrock/us.amazon.nova-2-lite-v1:0"
    - "bedrock/us.openai.gpt-oss-20b-1:0"
    - "bedrock/us.zai.glm-4.7-flash"
    - "vertex_ai/gemini-2.5-flash"
    - "vertex_ai/gemini-2.5-flash-lite"
  temperature: { min: 0.0, max: 1.0 }

  # --- Graph retrieval (only active when index_type is graph_only or hybrid_graph_vector) ---
  graph_retrieval:
    graph_query_modes:
      - "local"    # entity-focused: good for specific factual questions
      - "global"   # relationship-focused: good for broad thematic questions
      - "hybrid"   # combines local + global (usually best default)
    graph_top_k: { min: 20, max: 100 }
