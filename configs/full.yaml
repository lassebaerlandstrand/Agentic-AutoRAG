# Agentic AutoRAG — Full Configuration
# Complete search space with all supported options, including LightRAG graph retrieval.

meta:
  project_name: "my-rag-project"
  # corpus_path: "./data/corpus/arxiv/"
  # corpus_description: |
  #   A collection of ~50 ArXiv papers across 5 CS and physics categories.
  #   The corpus covers NLP, computer vision, machine learning,
  #   statistics, and optics. Documents are academic papers
  #   with mathematical notation, tables, figures, and references.

  # --- Alternative: BEIR / Natural Questions corpus ---
  # corpus_path: "./data/corpus/nq/"
  # corpus_description: |
  #   BEIR / Natural Questions corpus: Wikipedia passages (~100-300 words each).
  #   Standard retrieval benchmark; pre-extracted text, no PDF parsing involved.

  # --- Alternative: UniDoc-Bench corpus (real enterprise PDFs + images) ---
  corpus_path: "./data/corpus/unidoc/"
  corpus_description: |
    UniDoc-Bench corpus: real-world enterprise documents from the Healthcare
    domain. Includes multi-page PDFs with complex layouts (tables, figures, mixed
    text) alongside individual page images. Single-domain for maximum topical
    overlap and retrieval difficulty.

  output_dir: "./experiments/"
  max_trials: 10
  # Upper bound for the ingredient cache at experiments/.cache/ingredients/.
  # Each entry (chunks + embeddings for one chunker × embedder × corpus tuple)
  # is ~20 MB for a 10 k-chunk corpus and scales linearly with corpus size.
  # Raise this for larger corpora or wider search spaces; lower to trade cache
  # hit rate for disk. LRU evicts oldest entries when the budget is exceeded.
  cache_max_gb: 5.0

# Agent models (optimizer and examiner) — see README for provider API key requirements
agent:
  # examiner_model: "gemini/gemini-2.5-flash-lite"
  examiner_model: "gemini/gemini-3.1-flash-lite-preview"
  # examiner_model: "azure/gpt-5.4-nano"
  optimizer_model: "gemini/gemini-3-flash-preview"
  # Reasoning effort for the Diagnoser + Proposer LLM calls. "low" | "medium" |
  # "high" | null. Passed through to litellm.acompletion when the model
  # supports reasoning; silently skipped for models that don't.
  optimizer_reasoning_effort: medium
  max_history_trials: 10
  concurrency: 5 # Reduce if you hit LLM provider rate limits (e.g. 429 errors).

examiner:
  exam_size: 50
  initial_candidate_multiplier: 8
  max_backfill_rounds: 3
  probe_selection: true
  detect_parametric_leaks: false
  parametric_leak_trials: 3
  # parametric_leak_model: null  # Set to a stronger model for better leak detection

  # Source fact verification — each question carries 1-3 VERBATIM spans from
  # the source doc. Spans are located at generation time (exact find → whitespace-
  # tolerant find → fuzzy snap-to-source). Offsets are recorded and drive
  # deterministic chunk-relevance scoring at evaluation time.
  source_fact_min_length: 150
  source_fact_verify_fuzzy_threshold: 0.9

  # Chunk-relevance matcher (deterministic, replaces the old LLM judge).
  # Primary: character-offset interval overlap between retrieved chunk and span.
  chunk_relevance_min_overlap_chars: 50
  # Fallback for synthesized graph content (entity/relationship descriptions):
  # word n-gram coverage + longest consecutive run.
  chunk_relevance_ngram_size: 5
  chunk_relevance_overlap_threshold: 0.5
  chunk_relevance_min_run: 5

  # Document handling — set doc_split_word_threshold based on examiner model context:
  #   gemini-3.x (1M+ context): 200000 (effectively no splitting)
  #   gpt-4o (128k): 80000
  #   claude sonnet (200k): 120000
  #   default (conservative): 48000
  doc_split_word_threshold: 120000
  doc_section_word_size: 6000
  min_doc_words: 50

  # Oracle
  oracle_context_window_words: 300
  oracle_retry_with_full_doc: true

  # Multi-question per document
  max_questions_per_doc: 3

  # Quality filters
  max_generation_retries: 5
  dedup_similarity_threshold: 0.90
  discriminator_removal_pct: 0.05

  # Difficulty-aware allocation — concentrate questions in dense neighborhoods
  difficulty_weighted_allocation: true
  min_questions_per_cluster: 1

  embedding_model: "sentence-transformers/all-MiniLM-L6-v2" # Weakest embedding model to filter out easy questions

parsing:
  parser: "docling"
  ocr: true
  table_structure: true

# # Fixed graph build configuration — outside the search space.
# # Only needed if search_space.index_types includes "graph_only" or "hybrid_graph_vector".
# # The graph is built once, in batches of build_batch_size; progress is persisted to
# # build_manifest.json so a crashed build resumes where it left off. The manifest also
# # records the corpus + config hash — a mismatch causes a loud error rather than a
# # silent reuse. Delete ./experiments/lightrag/ to force a full rebuild.
# graph:
#   # Cheap extraction model called hundreds of times during build. All three below
#   # sit in the ~$0.10–0.24/1M-output-token range; pick the one matching whichever
#   # provider credentials you already have.
#   extraction_model: "gemini/gemini-2.5-flash-lite"                              # $0.10/$0.40 per 1M tokens
#   # extraction_model: "bedrock/global.amazon.nova-2-lite-v1:0"        # $0.06/$0.24 per 1M tokens
#   # extraction_model: "gemini/gemini-2.5-flash-lite"                  # $0.10/$0.40; may log malformed-record warnings
#   # Local via vLLM — auto-managed; server is started before the build and
#   # swapped out when trials need a different hosted_vllm/ model.
#   # extraction_model: "hosted_vllm/Qwen/Qwen3-30B-A3B-Instruct-AWQ"
#   embedding_model: "IEITYuan/Yuan-embedding-2.0-en"                   # local model, no API key needed
#   # Concurrency — peak LLM calls ≈ max_parallel_insert × llm_model_max_async.
#   # 4 × 4 = 16 is safe on free/low-tier cloud quotas; raise if you have headroom.
#   max_parallel_insert: 4       # documents processed concurrently
#   llm_model_max_async: 4       # concurrent LLM workers inside LightRAG
#   llm_model_max_retries: 3     # capped + jittered exponential back-off on 429/503
#   # Timeouts. LightRAG kills workers at 2× these internally; the config validator
#   # asserts our retry budget (extraction_call_timeout_s × attempts + sleeps) fits
#   # inside that kill window.
#   # default_llm_timeout: 180           # LightRAG default; worker cap = 360s
#   # default_embedding_timeout: 30      # LightRAG default; worker cap = 60s
#   # embedding_func_max_async: 8        # LightRAG default
#   extraction_call_timeout_s: 55      # per-call timeout passed to litellm.acompletion
#   # extraction_retry_backoff_base_s: 5 # first sleep ≈ base * 2^0 (with 0.5–1.5× jitter)
#   # extraction_retry_backoff_max_s: 30 # caps sleep so budget stays under worker cap
#   # Checkpointing & throughput — do not affect graph content, only how it's built.
#   build_batch_size: 16         # docs per ainsert call; smaller = more frequent checkpoints
#   embedding_batch_size: 64     # SentenceTransformer batch size; raise on GPU for speed
#   # chunk_token_size: 1200        # LightRAG internal chunking; omit to use LightRAG default
#   # chunk_overlap_token_size: 100  # omit to use LightRAG default
#   # entity_types: null            # omit = LightRAG defaults

# # Optional vLLM server settings — defaults are used when omitted.
# # Only relevant if search_space.llm_models includes hosted_vllm/ models.
# # The framework auto-manages the vLLM server: starting, stopping, and
# # swapping models between trials.
vllm:
  max_model_len: 8192            # auto-detected from model; set to reduce VRAM usage
  gpu_memory_utilization: 0.50   # embedding and reranker models also use VRAM
  enforce_eager: true            # faster model swap (~30s vs ~80s)
  port: 8000
  startup_timeout: 180
  extra_args: []                 # e.g. ["--reasoning-parser", "qwen3"]

# vllm:                                                                                                                                                                   
#   max_model_len: 8192                                     
#   gpu_memory_utilization: 0.50                                                                                                                                          
#   enforce_eager: true 

search_space:
  # --- Index-building ---
  chunking:
    strategies: ["recursive", "fixed"]
    chunk_token_size: { min: 64, max: 1024 }
    chunk_token_overlap: { min: 0, max: 128 }
  embedding_models:
    - "sentence-transformers/all-MiniLM-L6-v2"
    - "BAAI/bge-m3"
    - "BAAI/bge-large-en-v1.5"
    - "ibm-granite/granite-embedding-english-r2"
    - "Qwen/Qwen3-Embedding-0.6B"
    - "IEITYuan/Yuan-embedding-2.0-en"
    - "Snowflake/snowflake-arctic-embed-l-v2.0"
    - "mixedbread-ai/mxbai-embed-large-v1"
    - "intfloat/multilingual-e5-large-instruct"
    - "intfloat/e5-large-v2"
  index_types:
    - "vector_only"
    - "hybrid_bm25_vector"
    # - "graph_only"
    # - "hybrid_graph_vector"

  # --- Retrieval ---
  top_k: { min: 3, max: 20 }
  hybrid_alpha: { min: 0.0, max: 1.0 }
  reranker:
    models:
      - "none"
      - "BAAI/bge-reranker-v2-m3"
      - "cross-encoder/ms-marco-MiniLM-L-6-v2"
      - "Alibaba-NLP/gte-reranker-modernbert-base"
    top_n: { min: 3, max: 10 }
  query_expansion: ["none"]
  # query_expansion: ["none", "hyde", "multi_query"]

  # --- Generation ---
  llm_models:
    # Local — requires Ollama running (ollama serve) with models pulled
    # Note: Ollama models do not support reasoning via LiteLLM's reasoning_effort.
    # Reasoning is auto-disabled for ollama/ models unless explicitly overridden.
    # - "ollama/llama3.2"
    # - "ollama/llama3.1:8b"
    # - "ollama/mistral"
    # - "ollama/gemma2:9b"
    # - "ollama/qwen2.5:7b"
    # - "ollama/qwen2.5:14b"
    # - "ollama/phi4"

    # Local — requires vLLM (uv sync --extra vllm) and a GPU.
    # The framework manages the vLLM server automatically.
    # Pre-download models: uv run hf download <model-name>
    - "hosted_vllm/Qwen/Qwen3-0.6B"
    - "hosted_vllm/google/gemma-3-1b-it"
    - "hosted_vllm/ibm-granite/granite-3.3-2b-instruct"

    # # Cloud
    # - "bedrock/global.anthropic.claude-haiku-4-5-20251001-v1:0"
    # - "bedrock/global.anthropic.claude-sonnet-4-5-20250929-v1:0"
    # - "bedrock/global.amazon.nova-2-lite-v1:0"
    # - "bedrock/zai.glm-4.7-flash"
    # - "bedrock/openai.gpt-oss-20b-1:0"
    # - "bedrock/openai.gpt-oss-120b-1:0"
    # - "bedrock/qwen.qwen3-32b-v1:0"
    # - "bedrock/minimax.minimax-m2.1"
    # - "bedrock/minimax.minimax-m2.5"
    # # - "bedrock/moonshotai.kimi-k2.5"
    # - "bedrock/nvidia.nemotron-nano-3-30b"
    # - "bedrock/nvidia.nemotron-nano-12b-v2"

    # # - model: "vertex_ai/gemini-2.5-flash"
    # #   reasoning: true
    # # - "vertex_ai/gemini-2.5-flash-lite"

    # # - "azure/DeepSeek-V3.2"
    # - "azure/gpt-4o"
    # - "azure/gpt-4o-mini"
    # - "azure/o4-mini"
  temperature: { min: 1.0, max: 1.0 }
  reasoning: false # Global default: allow optimizer to enable reasoning for LLMs
  reasoning_effort: medium # Effort level when reasoning is enabled (low/medium/high)


